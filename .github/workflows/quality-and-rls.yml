name: Kvalitet og RLS

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: TypeScript, tests og build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      PROFILE_ENCRYPTION_KEY: ci-only-profile-encryption-key
      ORG_CONTEXT_SECRET: ci-only-org-context-secret
      NEXT_PUBLIC_SITE_URL: https://portal.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node scripts/check-i18n-coverage.mjs
      - run: node --import tsx --test tests/*.test.ts tests/*.test.tsx
      - run: npm run build

  database-security:
    name: Migrationer og RLS-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase test db
      - if: always()
        run: npx supabase stop --no-backup
